org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false

# Minecraft 1.21.1 targets (DESIGN.md §1). Mod identity and plugin versions: ../gradle.properties.
java_version=21
# The jars load on exactly this release: neoforge.mods.toml takes the range below, and fabric.mod.json
# asks for minecraft_version itself (Fabric's "~" would also accept 1.21.2 and later, which the
# jar was not built for).
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)

# NeoForge. NeoForm is the vanilla 1.21.1 setup common compiles against.
neoform_version=1.21.1-20240808.144430
neoforge_version=21.1.265
neoforge_version_range=[21.1.0,)
neoforge_loader_version_range=[4,)

# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.116.17+1.21.1
tr_energy_version=4.1.0
# ModMenu, compile-only: the 1.21 / 1.21.1 line
modmenu_version=11.0.3

# Dev server ports, in the 1.21.1 range of DESIGN.md §12 (runs/mc1211-<module>/server/server.properties
# is seeded with these).
dev_server_port_neoforge=25621
dev_server_port_fabric=25622
