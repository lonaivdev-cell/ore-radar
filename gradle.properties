# Shared by the Gradle builds in mc1201/, mc1211/ and paper/. No build is rooted here, so Gradle
# does not read this file by itself: each build's settings.gradle and gradle/conventions.gradle
# load it. Gradle's own switches (org.gradle.*) and each build's version pins live in that
# build's gradle.properties. A -P value on the command line overrides anything set here.

# Identity (DESIGN.md §1), expanded into mods.toml, neoforge.mods.toml, fabric.mod.json and
# plugin.yml at processResources. mod_description is the mods' description; the plugin has its own
# (paper/gradle.properties).
mod_id=oreradar
mod_name=Ore Radar
mod_version=2.0.0
mod_group=net.loserver.oreradar
mod_license=MIT
mod_authors=GLEYSSON
mod_description=Ore Radar is a handheld radar. It finds the nearest block of the kind the player chooses, then guides them to it with three aids: see-through outlines of the vein, an arrow and distance readout, and a beep. It is light, non-invasive and works alongside other mods. Install it on the server and on every client; for players without mods, use the Paper plugin.
mod_homepage=https://modrinth.com/mod/ore-radar
# Source and issue tracker, shown by the mod lists (Mod Menu, Forge/NeoForge's mod list).
mod_sources=https://github.com/lonaivdev-cell/ore-radar
mod_issues=https://github.com/lonaivdev-cell/ore-radar/issues

# Oldest Fabric Loader the Fabric jars accept (DESIGN.md §1).
fabric_loader_min_version=0.15

# Build plugins, one version for both Minecraft builds. Loom 1.17 is the newest line that runs on
# Java 21 and Gradle 9.5; Loom 1.18+ needs Java 25 and Gradle 9.7+.
loom_version=1.17.21
moddev_version=2.0.148
foojay_resolver_version=1.0.0
