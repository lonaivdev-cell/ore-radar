org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=false

# Paper target (DESIGN.md §1, §8). Mod identity: ../gradle.properties.
java_version=17
# 1.20.1-R0.1-SNAPSHOT, pinned to its last (final) build so a cached build never asks the network
# whether the snapshot moved.
paper_api_version=1.20.1-R0.1-20230921.165944-178
paper_api_level=1.20
# plugin.yml's description (the mods use mod_description). Single-quoted YAML: no apostrophes.
plugin_description=Ore Radar for vanilla players: a handheld radar that finds the nearest block of the kind the player chooses and guides them to it with the compass needle, glowing outlines, an action bar readout and a beep. No client mod needed. Before removing the plugin, take radars and fuel out of the charging stations.
