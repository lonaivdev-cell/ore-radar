org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false

# Minecraft 1.20.1 targets (DESIGN.md §1). Mod identity and plugin versions: ../gradle.properties.
java_version=17
# The jars load on exactly this release: mods.toml takes the range below, and fabric.mod.json
# asks for minecraft_version itself (Fabric's "~" would also accept 1.20.2 and later, which the
# jar was not built for).
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)

# Forge: compiled against the newest 47.4.x. The range stays [47,): the compatibility matrix
# (tools/test-compat/matrix.sh) boots and linkage-checks the jar on 47.0.0 and on the live
# DeceasedCraft server's 47.4.0.
forge_version=47.4.29
forge_version_range=[47,)
forge_loader_version_range=[47,)

# NeoForge for 1.20.1 (the 47.1.x fork of Forge, published as net.neoforged:forge). The neoforge
# module builds the forge module's sources against it into a jar of its own, so NeoForge players
# get a file named for their loader. NeoForge 1.20.1 still calls itself "forge" in mods.toml.
neoforge_version=47.1.106
neoforge_version_range=[47.1,)
neoforge_loader_version_range=[47,)

# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.92.12+1.20.1
tr_energy_version=3.0.0
# ModMenu, compile-only: the last line for 1.20.1
modmenu_version=7.2.2

# Dev server ports, in the 1.20.1 range of DESIGN.md §12 (runs/mc1201-<module>/server/server.properties
# is seeded with these).
dev_server_port_forge=25611
dev_server_port_fabric=25612
dev_server_port_neoforge=25614
