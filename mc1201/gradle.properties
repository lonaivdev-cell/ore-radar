org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false

# Minecraft 1.20.1 targets (DESIGN.md §1). Mod identity and plugin versions: ../gradle.properties.
java_version=17
# The jars load on exactly this release: mods.toml takes the range below, and fabric.mod.json
# asks for minecraft_version itself (Fabric's "~" would also accept 1.20.2 and later, which the
# jar was not built for).
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)

# Forge: compiled against 47.4.0, the version the live DeceasedCraft server runs, so nothing from a
# later 47.4.x slips in. The range stays [47,) because NeoForge 47.1 for 1.20.1 reports itself as
# forge 47.1 and must load the jar too.
forge_version=47.4.0
forge_version_range=[47,)
forge_loader_version_range=[47,)

# Fabric
fabric_loader_version=0.20.1
fabric_api_version=0.92.12+1.20.1
tr_energy_version=3.0.0
# ModMenu, compile-only: the last line for 1.20.1
modmenu_version=7.2.2

# Dev server ports, in the 1.20.1 range of DESIGN.md §12 (runs/mc1201-<module>/server/server.properties
# is seeded with these).
dev_server_port_forge=25611
dev_server_port_fabric=25612
